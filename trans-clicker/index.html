<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale= 1.0, maximum-scale=1.0, minimum-scale=1.0" />
  <title>clickr-js</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hdr1">
    <h1>НАВАЛЯЙ ТРАНСУ</h1>
  </div>
  <div id="roundCount"></div>
  <div id="hpPlayer"></div>
  <div id="hpEnemy"></div>

  <div id="divFace">
    <img id="face" src="https://i.postimg.cc/fbgN7fhC/6-E0-DCF1-E-823-D-4-F3-D-96-D2-9-A0406230-DC9.png" height="240" >
  </div>
  <div id="btn">
    <button id="fight">FIGHT!</button>
  </div>
  <div id="btnHelp">
    <button id="help">?</button>
  </div>




<div id="overlay"></div>
<div id="overlay1"></div>

<div class="popup" id="popup">
  <div class="popup-content">

  <h1 style="color: red">RTFM</h1>

  <div class="icon el" id="icon1">
    <button id="iconFight">FIGHT!</button>
  </div>

  <div class="text el" id="text1">
    <p>Нажми кнопку</p>
  </div>

  <div class="text el" id="text2">
    <p>Затапай транса пока транс не затапал тебя</p>
  </div>

  <div class="icon el" id="icon2">
    <img id="iconFace" src="https://i.postimg.cc/fbgN7fhC/6-E0-DCF1-E-823-D-4-F3-D-96-D2-9-A0406230-DC9.png" height="100" >
  </div>

  <div class="icon el" id="icon3">
    <img id="iconDrugs" src="https://i.postimg.cc/26DRJxCm/EBEB6-F21-3254-4500-808-F-084792-FF09-E3.gif" height="100" width="100" style="border-radius: 50%">
  </div>

  <div class="text el" id="text3">
    <p>После каждого раунда транс ускоряется. Сколько ты выдержишь?</p>
  </div>

  <div class="button el" id="buttonOk">
    <button id="helpOk">ПОН</button>
  </div>
</div>
</div>

<div class="popup" id="popupOk">
  <div class="popup-content">
    <div id="popupRound">
      <div class="el" id="popup-round-text"></div>
      <div class="el" id="popup-round-text-2"></div>
      <div class="button el">
        <button id="popup-round-close">OK</button>
      </div>
    </div>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
